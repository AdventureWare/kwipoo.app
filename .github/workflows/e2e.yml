name: E2E

on:
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - ".changeset/**"
      - "README.md"
      - "docs/**"
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - ".changeset/**"
      - "README.md"
      - "docs/**"

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run desktop smoke suite on pull requests
        if: github.event_name == 'pull_request'
        run: npm run test:e2e:smoke:ci

      - name: Run cross-viewport smoke suite on protected-branch pushes
        if: github.event_name == 'push'
        run: npm run test:e2e:full:ci

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
