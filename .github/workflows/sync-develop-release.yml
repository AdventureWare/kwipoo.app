name: Sync Release Back To Develop

on:
  push:
    branches:
      - main

concurrency:
  group: sync-develop-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-release-commit:
    if: "${{ github.event.head_commit.message == 'chore: version packages' }}"
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch protected branches
        run: git fetch origin main develop

      - name: Check whether develop already matches main release artifacts
        id: diff
        run: |
          if git diff --quiet origin/develop..origin/main -- .changeset package.json package-lock.json CHANGELOG.md; then
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create sync branch from develop
        if: steps.diff.outputs.needs_sync == 'true'
        run: git checkout -B chore/sync-version-packages-develop origin/develop

      - name: Cherry-pick release commit onto develop branch
        if: steps.diff.outputs.needs_sync == 'true'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: git cherry-pick -x "$RELEASE_SHA"

      - name: Push sync branch
        if: steps.diff.outputs.needs_sync == 'true'
        run: git push --force-with-lease origin HEAD:chore/sync-version-packages-develop

      - name: Create or reuse develop sync PR
        if: steps.diff.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing_pr="$(gh pr list \
            --base develop \
            --head chore/sync-version-packages-develop \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [ -n "$existing_pr" ]; then
            echo "Develop sync PR #$existing_pr already exists."
            exit 0
          fi

          gh pr create \
            --base develop \
            --head chore/sync-version-packages-develop \
            --title "chore: sync version packages into develop" \
            --body "$(cat <<'EOF'
          ## Summary
          - sync the generated Changesets release commit from `main` back into `develop`
          - keep `develop` aligned with shipped version metadata and changelog updates
          - consume the released `.changeset` entries on `develop` after the release lands

          ## Source
          - Triggered automatically by the `chore: version packages` release commit on `main`
          EOF
          )"
