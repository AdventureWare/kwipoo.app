name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint pull request commits
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Lint pushed commit range
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            npx commitlint --from HEAD~1 --to HEAD --verbose
          else
            npx commitlint --from "${{ github.event.before }}" --to "${{ github.event.after }}" --verbose
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run check

      - name: Run unit tests
        run: npm run test:unit

  e2e:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_ANALYTICS_PROVIDER: posthog
      PUBLIC_POSTHOG_KEY: phc_e2e_test_key
      PUBLIC_POSTHOG_HOST: ""
      PUBLIC_ANALYTICS_SCRIPT_URL: /analytics-test-stub.js
      PUBLIC_PREMIUM_SIGNUP_URL: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build e2e preview
        run: npm run build:e2e

      - name: Run desktop smoke suite on pull requests
        if: github.event_name == 'pull_request'
        run: npm run test:e2e:smoke:ci

      - name: Run cross-viewport smoke suite on main pushes
        if: github.event_name == 'push'
        run: npm run test:e2e:full:ci

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
